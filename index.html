<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hateyieo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bk: #070707;
  --d1: #101010;
  --d2: #1b1b1b;
  --g2: #6e6e6e;
  --g3: #a3a3a3;
  --w: #e6e6e6;
  --sans: 'Inter', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  /* Paste your complete base64 string or an image path here */
  --bg: none;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bk);
  color: var(--w);
  font-family: var(--sans);
}

.up {
  text-transform: uppercase;
}

.pad {
  padding: clamp(1rem, 3vw, 2.5rem);
}

.hero {
  position: relative;
  min-height: 100svh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.hero .img {
  position: absolute;
  inset: 0;
  background-image: var(--bg);
  background-size: cover;
  background-position: center;
  z-index: 0;
}

.hero .haze {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 30%, rgba(16, 16, 16, 0.35), rgba(7, 7, 7, 0.88));
  z-index: 1;
}

.hin {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  font-size: 0.75rem;
  letter-spacing: 0.08em;
}

.nav a {
  color: var(--g3);
  text-decoration: none;
  margin-right: 1.25rem;
}

.nav a:last-child {
  margin-right: 0;
}

.nav a:hover {
  color: var(--w);
}

/* Places ILLUSTRATOR and links on row 1, and .glass below on row 2 */
.hrow {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: baseline;
  row-gap: 2.5rem;
  column-gap: 1.5rem;
  margin-top: auto;
}

.hrow .big {
  grid-column: 1;
  grid-row: 1;
  margin: 0;
  font-size: clamp(2rem, 5vw, 4rem);
  font-weight: 300;
  letter-spacing: 0.04em;
}

.hrow .hl {
  grid-column: 2;
  grid-row: 1;
  display: flex;
  gap: 1.25rem;
  font-size: 0.75rem;
  letter-spacing: 0.08em;
}

.hrow .hl a {
  color: var(--g3);
  text-decoration: none;
}

.hrow .hl a.on,
.hrow .hl a:hover {
  color: var(--w);
  text-decoration: underline;
  text-underline-offset: 4px;
}

.hrow .glass {
  grid-column: 1 / -1;
  grid-row: 2;
  justify-self: center;
  max-width: 360px;
  padding: 1rem 1.25rem;
  background: rgba(27, 27, 27, 0.72);
  border: 1px solid rgba(230, 230, 230, 0.14);
  backdrop-filter: blur(12px);
  border-radius: 6px;
  font-size: 0.85rem;
  line-height: 1.45;
  color: var(--g3);
}

.hrow .glass small {
  display: block;
  font-size: 0.65rem;
  letter-spacing: 0.08em;
  color: var(--g2);
  margin-bottom: 0.35rem;
}

.hrow .glass b {
  display: block;
  color: var(--w);
  font-weight: 500;
  margin-bottom: 0.25rem;
}

@media (max-width: 640px) {
  .hrow {
    grid-template-columns: 1fr;
    row-gap: 1.5rem;
  }

  .hrow .hl {
    grid-column: 1;
    grid-row: 2;
  }

  .hrow .glass {
    grid-column: 1;
    grid-row: 3;
    justify-self: stretch;
    max-width: none;
  }
}
</style>
</head>
<body>
<header class="hero">
  <div class="img"></div>
  <div class="haze"></div>
  <div class="hin pad">
    <nav class="nav up">
      <div>
        <a href="#work">work</a>
        <a href="#about">about</a>
        <a href="#services">services</a>
      </div>
      <div class="lg mono" role="img" aria-label="HY monogram"></div>
      <div>
        <a href="#contact">contact <span class="grid-i"><i></i><i></i><i></i><i></i></span></a>
      </div>
    </nav>
    <div class="lg main" role="img" aria-label="hateyieo"></div>
    <div class="hrow">
      <h1 class="big">Illustrator</h1>
      <div class="glass">
        <small class="up">hateyieo / illustrator</small>
        <b>Chrome, thorns &amp; static</b>
        Illustration, posters, type and cover art in an underground rap style: chrome, thorns and a little nostalgia.
      </div>
      <div class="hl up">
        <a class="on" href="#work">work</a>
        <a href="#about">about</a>
        <a href="#contact">contact</a>
      </div>
    </div>
  </div>
</header>
</body>
</html>
